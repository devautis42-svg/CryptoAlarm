name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply smooth chart v1.2 source migration
        run: python3 scripts/apply_smooth_chart.py

      - name: Apply Futures live fix v1.2.1
        run: python3 scripts/apply_futures_live_fix.py

      - name: Apply Futures kline LIVE v1.2.2
        run: python3 scripts/apply_futures_kline_v122.py

      - name: Apply Futures REST fallback v1.2.3
        run: python3 scripts/apply_futures_rest_fallback_v123.py

      - name: Apply market filters v1.2.4
        run: python3 scripts/apply_market_filters_v124.py

      - name: Apply alarm engine fix v1.2.5
        run: python3 scripts/apply_alarm_engine_v125.py

      - name: Apply night watchdog v1.2.6
        run: python3 scripts/apply_night_watchdog_v126.py

      - name: Apply ringtone + Futures Live v1.2.7
        run: python3 scripts/apply_ringtone_futures_live_v127.py

      - name: Apply Futures WS diagnostics v1.2.8
        run: python3 scripts/apply_futures_ws_diagnostics_v128.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
